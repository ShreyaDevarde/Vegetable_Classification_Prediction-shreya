<!DOCTYPE html>
<html>
<head>
    <title>Vegetable Classification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <div class="logo">Vegetable classification</div>
    <nav>
        <a href="/">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="main-container">

    <form action="/result" method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <br>
        <button type="submit" class="submit-btn">Submit</button>
    </form>
    {% if pred %}
        <h2>Vegetable is {{ pred }}</h2>
    {% endif %}

    <img src="{{ url_for('static', filename='uploads/cartoon.jpeg') }}" class="bottom-image">
     
</div>


</body>
</html>
