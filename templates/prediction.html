<!DOCTYPE html>
<html>
<head>
    <title>Vegetable Classification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <div class="logo">Vegetable classification</div>
    <nav>
        <a href="/">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="main-container">

    <form action="/result" method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <br>
        <button type="submit" class="submit-btn">Submit</button>
    </form>
    <h3>Capture Live Image</h3>

    <video id="video" width="300" height="225" autoplay></video>
    <button type="button" onclick="capture()">Capture</button>
    <canvas id="canvas" width="300" height="225" style="display:none;"></canvas>
    <input type="hidden" name="captured_image" id="captured_image">

    {% if pred %}
        <h2>Vegetable is {{ pred }}</h2>
    {% endif %}

    <img src="{{ url_for('static', filename='uploads/cartoon.jpeg') }}" class="bottom-image">
     
</div>


</body>
</html>
